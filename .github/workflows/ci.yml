name: CPU CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: Lint, typecheck, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Typecheck source
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest

      - name: Smoke test installed CLI
        run: |
          uv run --locked reflex validate \
            --records data/fixtures/records.jsonl \
            --manifest data/fixtures/manifest.json
          uv run --locked reflex evaluate \
            --records data/fixtures/records.jsonl \
            --manifest data/fixtures/manifest.json \
            --predictions data/fixtures/predictions.jsonl \
            --output /tmp/reflex-fixture-report.json
